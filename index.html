<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>강의 홈페이지</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="petals" aria-hidden="true"></div>

  <header class="site-header" id="top">
    <div class="header-inner">
      <a class="brand" href="#top">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text" data-bind="site.title"></span>
      </a>
      <button class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="site-nav"></nav>
      <button class="admin-lock" type="button" aria-label="관리자 로그인" title="관리자">🔒</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="garden-gate">
        <!-- 문 위 아치 장식: 부채꼴 채광창 + 왕관 장식 (사진 참고, 직접 그림) -->
        <svg class="pediment" viewBox="-2 -2 244 142" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="pd-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4efe4"/><stop offset="1" stop-color="#dcd2bf"/></linearGradient>
            <linearGradient id="pd-glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#27411f"/><stop offset="1" stop-color="#4f7344"/></linearGradient>
          </defs>
          <path d="M46 120 A74 74 0 0 1 194 120 Z" fill="url(#pd-glass)"/>
          <g stroke="#efe9dc" stroke-width="3" stroke-linecap="round">
            <line x1="120" y1="120" x2="194" y2="120" transform="rotate(-15 120 120)"/>
            <line x1="120" y1="120" x2="194" y2="120" transform="rotate(-30 120 120)"/>
            <line x1="120" y1="120" x2="194" y2="120" transform="rotate(-45 120 120)"/>
            <line x1="120" y1="120" x2="194" y2="120" transform="rotate(-60 120 120)"/>
            <line x1="120" y1="120" x2="194" y2="120" transform="rotate(-75 120 120)"/>
            <line x1="120" y1="120" x2="194" y2="120" transform="rotate(-90 120 120)"/>
            <line x1="120" y1="120" x2="194" y2="120" transform="rotate(-105 120 120)"/>
            <line x1="120" y1="120" x2="194" y2="120" transform="rotate(-120 120 120)"/>
            <line x1="120" y1="120" x2="194" y2="120" transform="rotate(-135 120 120)"/>
            <line x1="120" y1="120" x2="194" y2="120" transform="rotate(-150 120 120)"/>
            <line x1="120" y1="120" x2="194" y2="120" transform="rotate(-165 120 120)"/>
          </g>
          <path d="M28 120 A92 92 0 0 1 212 120 L194 120 A74 74 0 0 0 46 120 Z" fill="url(#pd-wood)" stroke="#b9ae97" stroke-width="1.5"/>
          <path d="M36 120 A84 84 0 0 1 204 120" fill="none" stroke="#cfc5b0" stroke-width="1"/>
          <path d="M104 120 A16 16 0 0 1 136 120 Z" fill="url(#pd-wood)" stroke="#b9ae97" stroke-width="1.2"/>
          <rect x="2" y="118" width="236" height="20" rx="2" fill="url(#pd-wood)" stroke="#b9ae97" stroke-width="1.5"/>
          <rect x="10" y="124" width="220" height="2.5" fill="#cfc5b0"/>
          <circle cx="20" cy="110" r="8" fill="url(#pd-wood)" stroke="#b9ae97" stroke-width="1.2"/>
          <circle cx="220" cy="110" r="8" fill="url(#pd-wood)" stroke="#b9ae97" stroke-width="1.2"/>
          <path d="M108 36 L112 24 L128 24 L132 36 Z" fill="url(#pd-wood)" stroke="#b9ae97" stroke-width="1.2"/>
          <path d="M94 26 C99 8 115 6 120 0 C125 6 141 8 146 26 C137 18 129 16 120 18 C111 16 103 18 94 26 Z" fill="url(#pd-wood)" stroke="#b9ae97" stroke-width="1.2"/>
          <circle cx="96" cy="24" r="4.5" fill="url(#pd-wood)" stroke="#b9ae97"/>
          <circle cx="144" cy="24" r="4.5" fill="url(#pd-wood)" stroke="#b9ae97"/>
          <g fill="#c7b99e" opacity=".55"><ellipse cx="58" cy="78" rx="4" ry="2"/><ellipse cx="170" cy="62" rx="3" ry="1.6"/><ellipse cx="90" cy="45" rx="2.5" ry="1.4"/><ellipse cx="60" cy="130" rx="6" ry="1.6"/><ellipse cx="190" cy="128" rx="4" ry="1.4"/></g>
        </svg>
        <div class="doorway">
          <div class="hero-inner">
            <span class="hero-badge" data-bind="site.badge"></span>
            <p class="hero-eyebrow"></p>
            <h1 class="hero-title" data-bind="site.title"></h1>
            <p class="hero-ja" data-bind="site.titleAlt"></p>
            <p class="hero-sub" data-bind="site.subtitle"></p>
            <p class="hero-desc" data-bind="site.description"></p>
            <div class="hero-buttons" id="hero-buttons"></div>
          </div>
          <div class="gate-door left" aria-hidden="true"><span class="door-window"></span><span class="door-bucket"></span><span class="door-panel"></span></div>
          <div class="gate-door right" aria-hidden="true"><span class="door-window"></span><span class="door-bucket"></span><span class="door-panel"></span></div>
          <div class="planter left" aria-hidden="true"></div>
          <div class="planter right" aria-hidden="true"></div>
        </div>
        <div class="stone-path" aria-hidden="true"></div>
      </div>
      <div class="quick-info" id="quick-info"></div>
    </section>

    <section class="section notice-section" id="notice" hidden></section>
    <section class="section" id="about"></section>
    <section class="section" id="curriculum"></section>
    <section class="section" id="portfolio"></section>
    <section class="section" id="tools"></section>
    <section class="section" id="enroll"></section>
    <section class="section" id="participate"></section>
    <section class="section" id="faq"></section>
  </main>

  <footer class="site-footer" id="instructor"></footer>

  <button class="to-top" aria-label="맨 위로">↑</button>

  <script src="config.js"></script>
  <script src="override.js"></script>
  <script src="app.js"></script>
  <script src="participate.js"></script>
  <script src="admin.js"></script>
  <script src="editor.js"></script>
</body>
</html>
